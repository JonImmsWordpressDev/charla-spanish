<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charla Spanish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone-width app shell. The lesson path is a zigzag of azulejo (glazed tile) diamonds, the one bold element. Everything else stays quiet. */
:root{
  --bg:#f2f5fb; --surface:#ffffff; --ink:#14213d; --muted:#5b6785; --line:#d7deec;
  --primary:#1f4fd8; --primary-deep:#173aa3; --on-primary:#ffffff;
  --accent:#f4a917; --accent-deep:#c98300; --on-accent:#2b1d00;
  --good:#18895c; --good-bg:#dcf4e8; --bad:#cf3c34; --bad-bg:#fde5e2;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1322; --surface:#172036; --ink:#eaf0ff; --muted:#9aa7c7; --line:#2a3655;
    --primary:#5b85ff; --primary-deep:#3a5fd6; --on-primary:#06102b;
    --accent:#f7b93a; --accent-deep:#b98312; --on-accent:#2b1d00;
    --good:#3ccf93; --good-bg:#12382b; --bad:#ff7b72; --bad-bg:#40201e;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1322; --surface:#172036; --ink:#eaf0ff; --muted:#9aa7c7; --line:#2a3655;
  --primary:#5b85ff; --primary-deep:#3a5fd6; --on-primary:#06102b;
  --accent:#f7b93a; --accent-deep:#b98312; --on-accent:#2b1d00;
  --good:#3ccf93; --good-bg:#12382b; --bad:#ff7b72; --bad-bg:#40201e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.ic.fill{fill:currentColor;stroke:none}

.app{position:relative;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;color:var(--primary);margin-right:auto}
.brand i{font-style:normal;color:var(--accent)}
.stat{display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.streak{color:var(--accent-deep)} .stat.xp{color:var(--primary)} .stat.hearts{color:var(--bad)}
:root[data-theme="dark"] .stat.streak{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat.streak{color:var(--accent)}}
main{flex:1;overflow-y:auto;padding:16px 16px 32px}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 12px;color:var(--muted);text-decoration:none;font-size:.78rem;font-weight:600}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--primary)}

h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;line-height:1.15;margin:0;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)} .small{font-size:.875rem}
.row{display:flex;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:700;background:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 var(--primary-deep);transition:transform .06s, box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-deep)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.btn.wide{width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset, 0 3px 0 var(--line)}
.btn.good{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 70%,#000);color:#fff}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000);color:#fff}
.link{color:var(--muted);font-weight:600;text-decoration:underline;font-size:.9rem;padding:8px}

/* Daily goal */
.goal{display:flex;align-items:center;gap:16px}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .5s}
.goal b{font-family:var(--display);font-size:1.25rem}

/* Units and tile path */
.unit{margin-top:24px}
.banner{border-radius:var(--r);padding:16px;color:#fff;background-color:#1f4fd8;
  background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.18) 0 3px,transparent 4px),linear-gradient(45deg,rgba(255,255,255,.09) 25%,transparent 25% 75%,rgba(255,255,255,.09) 75%),linear-gradient(-45deg,rgba(255,255,255,.09) 25%,transparent 25% 75%,rgba(255,255,255,.09) 75%);
  background-size:28px 28px}
.banner .eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.banner h2{font-size:1.4rem;margin-top:2px}
.banner .es{opacity:.9;font-style:italic}
.path{display:flex;flex-direction:column;align-items:center;gap:30px;padding:34px 0 10px}
.node{display:flex;flex-direction:column;align-items:center;gap:20px;position:relative}
.tile{width:72px;height:72px;border-radius:18px;transform:rotate(45deg);display:grid;place-items:center;background:var(--line);color:var(--muted);box-shadow:4px 4px 0 color-mix(in srgb,var(--line) 70%,#000 12%);transition:transform .08s}
.tile>span{transform:rotate(-45deg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem}
.tile svg{width:28px;height:28px}
.node.done .tile{background:var(--accent);color:var(--on-accent);box-shadow:4px 4px 0 var(--accent-deep)}
.node.current .tile{background:var(--primary);color:var(--on-primary);box-shadow:4px 4px 0 var(--primary-deep)}
.node.current .tile::after{content:"";position:absolute;inset:-9px;border-radius:24px;border:3px solid var(--primary);opacity:.35;animation:pulse 1.8s ease-in-out infinite}
.node:not(.locked) .tile:active{transform:rotate(45deg) translate(2px,2px);box-shadow:1px 1px 0 var(--primary-deep)}
.node .label{font-weight:700;font-size:.9rem;text-align:center;max-width:140px}
.node.locked .label{color:var(--muted)}
.node .start{position:absolute;top:-34px;background:var(--surface);border:1.5px solid var(--line);color:var(--primary);font-weight:800;font-size:.75rem;letter-spacing:.06em;padding:4px 10px;border-radius:10px;z-index:1}
@keyframes pulse{50%{transform:scale(1.08);opacity:.12}}

/* Lesson overlay */
.lesson{position:absolute;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column}
.lbar{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lbar .close{color:var(--muted);padding:4px} .lbar .close svg{width:24px;height:24px}
.prog{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s}
.lbody{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:18px}
.lbody h2{font-size:1.45rem}
.lfoot{padding:14px 16px 18px;border-top:1px solid var(--line);background:var(--surface)}
.lfoot.ok{background:var(--good-bg);border-color:transparent} .lfoot.no{background:var(--bad-bg);border-color:transparent}
.fb h3{font-size:1.2rem;display:flex;align-items:center;gap:8px}
.lfoot.ok h3{color:var(--good)} .lfoot.no h3{color:var(--bad)}
.fb p{margin:6px 0 0} .fb .ans{font-weight:700}
.fb .explain{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:.95rem;white-space:pre-wrap}
.fb .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.fb .actions .btn{flex:1}

.wordcard{display:flex;align-items:center;gap:12px;font-size:1.3rem;font-weight:700}
.sound{width:48px;height:48px;border-radius:14px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 3px 0 var(--primary-deep);flex:none}
.sound svg{width:24px;height:24px}
.sound.big{width:84px;height:84px;border-radius:22px} .sound.big svg{width:40px;height:40px}
.sound.slow{background:var(--surface);color:var(--primary);box-shadow:0 0 0 1.5px var(--line) inset,0 3px 0 var(--line);font-weight:800;font-size:.8rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1.5px var(--line) inset,0 3px 0 var(--line);font-weight:600;font-size:1.05rem}
.opt[aria-pressed="true"]{box-shadow:0 0 0 2px var(--primary) inset,0 3px 0 var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--surface))}
.line{min-height:62px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:9px 14px;border-radius:12px;background:var(--surface);box-shadow:0 0 0 1.5px var(--line) inset,0 3px 0 var(--line);font-weight:600}
.chip.used{visibility:hidden}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{text-align:center;min-height:54px}
.match .opt.gone{opacity:.35;pointer-events:none;box-shadow:0 0 0 1.5px var(--good) inset;color:var(--good)}
.match .opt.shake{animation:shake .3s;box-shadow:0 0 0 2px var(--bad) inset}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.field{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:1.1rem}
.accents{display:flex;gap:6px;flex-wrap:wrap}
.accents button{min-width:40px;height:40px;border-radius:10px;background:var(--surface);box-shadow:0 0 0 1.5px var(--line) inset;font-weight:700}
.mic{width:96px;height:96px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 5px 0 var(--primary-deep);align-self:center}
.mic svg{width:42px;height:42px}
.mic.on{background:var(--bad);box-shadow:0 5px 0 color-mix(in srgb,var(--bad) 70%,#000);animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{transform:scale(1.06)}}
.heard{text-align:center;min-height:1.5em;font-weight:600}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.done-screen{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:24px;text-align:center}
.done-screen h2{font-size:2rem}
.badge{width:110px;height:110px;border-radius:26px;transform:rotate(45deg);background:var(--accent);box-shadow:6px 6px 0 var(--accent-deep);display:grid;place-items:center;color:var(--on-accent);margin:20px}
.badge svg{transform:rotate(-45deg);width:54px;height:54px}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tiles3 .card{padding:12px 8px;text-align:center}
.tiles3 b{display:block;font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}

/* Tutor */
.scen{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.scen button{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--surface);box-shadow:0 0 0 1.5px var(--line) inset;font-weight:600;font-size:.9rem}
.scen button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);box-shadow:none}
.chat{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-color:transparent}
.msg .es{font-size:1.08rem;font-weight:600}
.msg .en{margin-top:6px;color:var(--muted);font-size:.92rem}
.msg .tip{margin-top:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 22%,var(--surface));font-size:.9rem}
.msg .tools{display:flex;gap:14px;margin-top:8px}
.msg .tools button{color:var(--primary);font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:4px}
.composer{display:flex;gap:8px;align-items:center}
.composer .field{flex:1}
.iconbtn{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:0 0 0 1.5px var(--line) inset;color:var(--primary);flex:none}
.iconbtn.on{background:var(--bad);color:#fff;box-shadow:none}

/* Profile */
.week{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:12px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.week i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--primary);min-height:4px}
.week .today i{background:var(--accent)}
.sheet{position:absolute;inset:0;z-index:6;background:rgba(8,12,24,.55);display:flex;align-items:flex-end}
.sheet .card{width:100%;border-radius:22px 22px 0 0;padding:22px 18px 26px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">charla<i>.</i></div>
    <div class="stat streak" id="s-streak" title="Day streak"></div>
    <div class="stat xp" id="s-xp" title="Total XP"></div>
    <div class="stat hearts" id="s-hearts" title="Hearts"></div>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>
<script>
"use strict";
/* ---------- Course content: Spanish A1 ---------- */
// vocab: [spanish, english, ...accepted english alternates]
const COURSE=[
{id:"u1",title:"First words",es:"Lo básico",lessons:[
 {id:"u1l1",title:"Greetings",vocab:[["hola","hello","hi"],["adiós","goodbye","bye"],["gracias","thank you","thanks"],["por favor","please"],["buenos días","good morning"],["buenas noches","good night"]],
  sentences:[{es:"Hola, buenos días",en:"Hello, good morning",alt:["Hi, good morning"]},{es:"Gracias, adiós",en:"Thank you, goodbye",alt:["Thanks, goodbye","Thanks, bye","Thank you, bye"]},{es:"Sí, por favor",en:"Yes, please"},{es:"Buenas noches, María",en:"Good night, María"}]},
 {id:"u1l2",title:"People",vocab:[["el hombre","man"],["la mujer","woman"],["el niño","boy"],["la niña","girl"],["yo","I"],["tú","you"]],
  sentences:[{es:"Yo soy un hombre",en:"I am a man"},{es:"Tú eres una mujer",en:"You are a woman"},{es:"Yo soy una niña",en:"I am a girl"},{es:"Tú eres un niño",en:"You are a boy"}]},
 {id:"u1l3",title:"Introductions",vocab:[["me llamo","my name is","I am called"],["¿cómo estás?","how are you?"],["bien","fine","well","good"],["mucho gusto","nice to meet you","pleased to meet you"],["y","and"],["también","also","too"]],
  sentences:[{es:"Me llamo Ana",en:"My name is Ana",alt:["I am called Ana"]},{es:"Estoy bien, gracias",en:"I am fine, thank you",alt:["I am well, thank you","I am fine, thanks","I am good, thank you","I am good, thanks","I am well, thanks"]},{es:"Mucho gusto, Ana",en:"Nice to meet you, Ana",alt:["Pleased to meet you, Ana"]},{es:"¿Cómo estás, María?",en:"How are you, María?"}]}
]},
{id:"u2",title:"Food and drink",es:"Comida y bebida",lessons:[
 {id:"u2l1",title:"The basics",vocab:[["el agua","water"],["el pan","bread"],["la manzana","apple"],["la leche","milk"],["el café","coffee"],["el queso","cheese"]],
  sentences:[{es:"Yo como pan",en:"I eat bread"},{es:"Tú bebes agua",en:"You drink water"},{es:"Ella come una manzana",en:"She eats an apple"},{es:"Yo bebo café con leche",en:"I drink coffee with milk"}]},
 {id:"u2l2",title:"At the café",vocab:[["quiero","I want"],["la cuenta","bill","check"],["la mesa","table"],["el té","tea"],["el azúcar","sugar"],["sin","without"]],
  sentences:[{es:"Quiero un café, por favor",en:"I want a coffee, please"},{es:"La cuenta, por favor",en:"The bill, please",alt:["The check, please"]},{es:"Un té sin azúcar",en:"A tea without sugar"},{es:"Una mesa para dos",en:"A table for two"}]},
 {id:"u2l3",title:"Meals",vocab:[["el desayuno","breakfast"],["el almuerzo","lunch"],["la cena","dinner"],["el pollo","chicken"],["el arroz","rice"],["la fruta","fruit"]],
  sentences:[{es:"Yo como pollo con arroz",en:"I eat chicken with rice"},{es:"El desayuno es bueno",en:"The breakfast is good",alt:["Breakfast is good"]},{es:"Ella come fruta",en:"She eats fruit"},{es:"Nosotros comemos la cena",en:"We eat dinner",alt:["We eat the dinner"]}]}
]},
{id:"u3",title:"Family and home",es:"Familia y casa",lessons:[
 {id:"u3l1",title:"Family",vocab:[["la madre","mother","mom"],["el padre","father","dad"],["el hermano","brother"],["la hermana","sister"],["el hijo","son"],["la hija","daughter"]],
  sentences:[{es:"Mi madre es alta",en:"My mother is tall",alt:["My mom is tall"]},{es:"Tengo un hermano",en:"I have a brother"},{es:"Él es mi padre",en:"He is my father",alt:["He is my dad"]},{es:"Mi hermana se llama Lucía",en:"My sister is called Lucía",alt:["My sister's name is Lucía"]}]},
 {id:"u3l2",title:"At home",vocab:[["la casa","house","home"],["la cocina","kitchen"],["el baño","bathroom"],["la cama","bed"],["la puerta","door"],["la ventana","window"]],
  sentences:[{es:"Mi casa es grande",en:"My house is big",alt:["My house is large","My home is big"]},{es:"La cocina es pequeña",en:"The kitchen is small"},{es:"¿Dónde está el baño?",en:"Where is the bathroom?"},{es:"La puerta está abierta",en:"The door is open"}]},
 {id:"u3l3",title:"Describing",vocab:[["grande","big","large"],["pequeño","small","little"],["nuevo","new"],["viejo","old"],["bonito","pretty","beautiful","nice"],["feliz","happy"]],
  sentences:[{es:"El gato es pequeño",en:"The cat is small",alt:["The cat is little"]},{es:"Tengo una casa nueva",en:"I have a new house"},{es:"Mi familia es feliz",en:"My family is happy"},{es:"La ciudad es bonita",en:"The city is pretty",alt:["The city is beautiful","The city is nice"]}]}
]},
{id:"u4",title:"Out and about",es:"Por la ciudad",lessons:[
 {id:"u4l1",title:"Numbers",vocab:[["uno","one"],["dos","two"],["tres","three"],["cuatro","four"],["cinco","five"],["diez","ten"]],
  sentences:[{es:"Tengo dos hermanos",en:"I have two brothers",alt:["I have two siblings"]},{es:"Quiero tres manzanas",en:"I want three apples"},{es:"Son las cinco",en:"It is five o'clock",alt:["It is five"]},{es:"Cuatro cafés, por favor",en:"Four coffees, please"}]},
 {id:"u4l2",title:"Directions",vocab:[["la calle","street"],["la tienda","store","shop"],["el banco","bank"],["aquí","here"],["cerca","near","close","nearby"],["lejos","far","far away"]],
  sentences:[{es:"¿Dónde está el banco?",en:"Where is the bank?"},{es:"La tienda está cerca",en:"The store is near",alt:["The store is close","The store is nearby","The shop is near","The shop is close","The shop is nearby"]},{es:"El hotel está lejos de aquí",en:"The hotel is far from here"},{es:"Vivo en esta calle",en:"I live on this street",alt:["I live in this street"]}]},
 {id:"u4l3",title:"Travel",vocab:[["el tren","train"],["el boleto","ticket"],["el aeropuerto","airport"],["hoy","today"],["mañana","tomorrow"],["ahora","now"]],
  sentences:[{es:"Necesito un boleto",en:"I need a ticket"},{es:"El tren sale ahora",en:"The train leaves now",alt:["The train is leaving now"]},{es:"Voy al aeropuerto mañana",en:"I am going to the airport tomorrow",alt:["I go to the airport tomorrow"]},{es:"Hoy viajo a Madrid",en:"Today I travel to Madrid",alt:["I travel to Madrid today","Today I am traveling to Madrid","I am traveling to Madrid today"]}]}
]},
{id:"u5",title:"Days and routines",es:"El día a día",lessons:[
 {id:"u5l1",title:"Days of the week",vocab:[["el lunes","Monday"],["el martes","Tuesday"],["el miércoles","Wednesday"],["el viernes","Friday"],["el sábado","Saturday"],["el domingo","Sunday"]],
